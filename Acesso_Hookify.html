
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 296mm; /* Exactly one A4 page */
            overflow: hidden;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            text-align: center;
            color: #1a1a1a;
            /* Fundo colorido com gradiente suave e moderno */
            background: linear-gradient(135deg, #f0f7ff 0%, #e0e7ff 50%, #f3e8ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 70px 50px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            width: 80%;
            max-width: 600px;
        }
        .logo-container {
            margin-bottom: 40px;
        }
        .logo-container img {
            max-height: 80px;
            object-fit: contain;
        }
        h1 {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 25px;
            color: #111;
            line-height: 1.3;
            margin-top: 0;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 45px;
            font-weight: 400;
            margin-top: 0;
        }
        .button {
            display: inline-block;
            /* Botão colorido */
            background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            color: #fff !important;
            text-decoration: none;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
